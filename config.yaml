# Luke's design config. All previously blank required fields are now set (Luke-approved values, or
# "placeholder, pending Daedalus leg/footpad design" for the lander leg and footpad fields).
# Each value's comment tags it Luke-approved + SOURCED (with source) or ESTIMATE.
# AI assistance (research, recommended values, config edits) is disclosed under rule 8.6.
# DESIGN CASE: radiator louvers FAIL CLOSED. The sizer's louvers-stuck-open line is information only.
# For a runnable example: python sizer.py examples/example_config.yaml

meta:
  title: "NASA Moon Base Challenge — Luke's sizing inputs. Design case: radiator louvers fail closed (stuck-open result is information only). AI-assisted, disclosed under rule 8.6."
  mode: "solve_rtg"  # solve_rtg | fixed_rtg

loads:
  primary_w:
    value: 3000  # Luke-approved: ~3000 W expected night load (was 5000 W). Solved loads for 2000 kg system mass: ~2820 W at 150 Wh/kg, ~3740 W at 200 Wh/kg. AI-assisted, rule 8.6.
    units: W
    source: "Luke — primary night electrical load, 3000 W (about 3 kW expected; target system mass ~2000 kg)"
    owner: luke
night:
  t_dark_h:
    value: 72
    units: h
    source: "Luke — longest dark interval at the chosen CR1 site (CR1 illumination model). Program-level 'Night survival 120+ hours' in Requirements doc is the mission target; Luke chose 72 h for this site."
    owner: luke

battery:
  depth_of_discharge:
    value: 0.8
    units: dimensionless
    source: "Luke"
    owner: luke
  efficiency:
    value: 0.9
    units: dimensionless
    source: "Luke — whole discharge path: cells + DC-DC to 1 kV bus (used with eta_definition: discharge)"
    owner: luke
  eta_definition:
    value: discharge
    units: "round_trip | discharge"
    source: "Luke — discharge η for pack sizing and Q_internal; η=0.9 is cells + DC-DC to 1 kV bus"
    owner: luke
  specific_energy_wh_per_kg_low:
    value: 150
    units: Wh/kg
    source: "Colozza 2020; Slusser, Wilcox & Hernandez 2023; Reid & Bennett 2009 (pack level)"
    owner: luke
  specific_energy_wh_per_kg_high:
    value: 200
    units: Wh/kg
    source: "Upper end of Luke's pack-level requirement range"
    owner: luke
  packaging_insulation_mass_factor:
    value: 1.05  # Luke-approved, ESTIMATE: about 1.3% MLI (Colozza 2020 Eq.81, Table 18) plus enclosure/harness allowance; no direct source. AI-assisted, disclosed under rule 8.6.
    units: dimensionless
    source: "Luke-approved, ESTIMATE: about 1.3% MLI (Colozza 2020 Eq.81, Table 18) plus enclosure/harness allowance; no direct source. AI-assisted, disclosed under rule 8.6."
    owner: luke
  bus_voltage_v:
    value: 1000
    units: V
    source: "Luke — pack bus voltage (may change)"
    owner: luke
  cell_nominal_voltage_v:
    value: 3.6  # Luke-approved, SOURCED: Saft space Li-ion brochure doc 54085-2-0413 (VES16 mean 3.6 V); Walker 2020 NTRS 20205010300 (21700 cells 3.6-3.63 V). AI-assisted, disclosed under rule 8.6.
    units: V
    source: "Luke-approved, SOURCED: Saft space Li-ion brochure doc 54085-2-0413 (VES16 mean 3.6 V); Walker 2020 NTRS 20205010300 (21700 cells 3.6-3.63 V). AI-assisted, disclosed under rule 8.6."
    owner: luke
  cell_capacity_ah:
    value: null
    units: Ah
    source: "Unset — report pack-level only until Luke selects cell"
    owner: TODO-luke
  capacity_derating_factor_at_0c:
    value: null
    units: dimensionless
    source: "Usable fraction of capacity at 0 C operating point"
    owner: TODO-luke
  minimum_charge_temperature_k:
    value: null
    units: K
    source: "Minimum T before charge (lithium plating concern)"
    owner: TODO-luke
  box_target_temperature_k:
    value: 273.15
    units: K
    source: "Luke's choice — Moon Base Requirements & Numbers doc, row 'LiPo cold limit: 233 K, 273 K optimal' (273 K optimal hold temperature)"
    owner: luke
  lipo_cold_limit_k:
    value: 233
    units: K
    source: "Luke's Moon Base Requirements & Numbers doc, row 'LiPo cold limit: 233 K, 273 K optimal' (sources listed there: Cold Electronics for Lunar Missions; Flight Battery Program 2010)"
    owner: luke
  pack_volumetric_energy_density_wh_per_m3:
    value: 250000
    units: Wh/m^3
    source: "Luke chose ~250 Wh/L (pack-level), NASA Small Spacecraft Technology State of the Art 2026, Table 3-5 Battery (Pack) Product Table, p.44: https://www.nasa.gov/wp-content/uploads/2026/05/3-soa-power-2026-final.pdf; CubeSat-scale packs (3–34 Ah) in that table, large packs may be lower"
    owner: luke
  pack_specific_heat_j_per_kgk:
    value: 800  # Luke-approved, SOURCED: Jones 2011, NASA/TM-2011-216994 (battery cp 800 J/kg-K); needed for cold-shutdown case. AI-assisted, disclosed under rule 8.6.
    units: J/kg-K
    source: "Luke-approved, SOURCED: Jones 2011, NASA/TM-2011-216994 (battery cp 800 J/kg-K); needed for cold-shutdown case. AI-assisted, disclosed under rule 8.6."
    owner: luke
  lipo_margin_threshold_k:
    value: null
    units: K
    source: "Luke — minimum acceptable LiPo margin at dawn after cold-shutdown coast"
    owner: TODO-luke

thermal_environment:
  deep_space_sink_k:
    value: 3
    units: K
    source: "Fixsen 2009 CMB"
    owner: luke
  night_surface_k:
    value: 40
    units: K
    source: "Luke — Diviner polar night surface (Williams et al. 2019 JGR Planets; Schorghofer & Williams 2020 PSJ), per Requirements doc"
    owner: luke
  regolith_k_surface_w_per_mk:
    value: 7.4e-4
    units: W/m-K
    source: "Hayne et al. 2017 Table A1 — near-surface"
    owner: cited-example
  regolith_k_depth_w_per_mk:
    value: 3.4e-3
    units: W/m-K
    source: "Hayne et al. 2017 Table A1 — at ~6–7 cm depth scale"
    owner: cited-example
  footpad_contact_conductance_w_per_m2k:
    value: 10
    units: W/m^2-K
    source: "Okishio et al. 2015 ICES-2015-318 (example contact conductance)"
    owner: cited-example
  lander_deck_temperature_k:
    value: null
    units: K
    source: "Required when box bottom sees lander_deck (not T_box default)"
    owner: TODO-luke

layout:
  model:
    value: distributed_packs
    units: string
    source: "Luke — several smaller packs across the base (no central RTG deck)"
    owner: luke

geometry:
  n_packs:
    value: 8  # Luke-approved, Luke's choice: 8 packs; per-pack volume = (fleet energy / 8) / 250 Wh/L. AI-assisted, disclosed under rule 8.6.
    units: count
    source: "Luke-approved, Luke's choice: 8 packs; per-pack volume = (fleet energy / 8) / 250 Wh/L. AI-assisted, disclosed under rule 8.6."
    owner: luke
  scale_dims_with_n_packs:
    value: true
    units: boolean
    source: "Per-pack box volume from V=(C/n)/ρ_vol vs reference aspect ratio"
    owner: numerical
  box_length_m:
    value: 0.8  # Luke-approved, Luke's choice: shape reference only: sizer rescales to pack volume keeping 1.0:0.8:0.6. AI-assisted, disclosed under rule 8.6.
    units: m
    source: "Luke-approved, Luke's choice: shape reference only: sizer rescales to pack volume keeping 1.0:0.8:0.6. AI-assisted, disclosed under rule 8.6."
    owner: luke
  box_width_m:
    value: 0.64  # Luke-approved, Luke's choice: shape reference only (1.0:0.8:0.6). AI-assisted, disclosed under rule 8.6.
    units: m
    source: "Luke-approved, Luke's choice: shape reference only (1.0:0.8:0.6). AI-assisted, disclosed under rule 8.6."
    owner: luke
  box_height_m:
    value: 0.48  # Luke-approved, Luke's choice: shape reference only (1.0:0.8:0.6). AI-assisted, disclosed under rule 8.6.
    units: m
    source: "Luke-approved, Luke's choice: shape reference only (1.0:0.8:0.6). AI-assisted, disclosed under rule 8.6."
    owner: luke
  ring_radius_m:
    value: null
    units: m
    source: "Luke — ring centerline radius"
    owner: TODO-luke
  bottom_radiates_to:
    value: null
    units: "ground | lander_deck"
    source: "Whether box bottom sees regolith or lander deck"
    owner: TODO-luke
  view_factor_sky_vertical:
    value: 0.5
    units: dimensionless
    source: "Wohl et al. 2024 NASA/TM-20240003496 — vertical faces"
    owner: cited-example
  view_factor_ground_vertical:
    value: 0.5
    units: dimensionless
    source: "Wohl et al. 2024 — vertical faces"
    owner: cited-example

radiation:
  box_effective_emittance:
    value: 0.02
    units: dimensionless
    source: "Gilmore 2002 Vol.1 p.165 — typical MLI range 0.015–0.030"
    owner: cited-example
  penetration_seam_emittance_multiplier:
    value: null
    units: dimensionless
    source: "Gilmore p.165 — higher effective e* with penetrations/seams on small blankets"
    owner: TODO-luke
  emittance_sensitivity:
    - { value: 0.015, label: "MLI low (Gilmore)" }
    - { value: 0.02, label: "MLI mid" }
    - { value: 0.03, label: "MLI high (Gilmore)" }
    - { value: 0.0028, label: "LEMS-A3 (Rodriguez-Ruiz & Burbridge 2025)" }
    - { value: 0.92, label: "Bare Z-93 (Kauder 2005)" }
    - { value: 0.03, label: "Polished Al (Kauder 2005)" }

radiator:
  radiator_emissivity:
    value: 0.84  # Luke-approved, SOURCED: Colozza 2020 Table 16 (NASA/CR-2020-220368); bare Z-93 is 0.92 BOL per Kauder 2005, 0.84 leaves dust/aging margin. AI-assisted, disclosed under rule 8.6.
    units: dimensionless
    source: "Luke-approved, SOURCED: Colozza 2020 Table 16 (NASA/CR-2020-220368); bare Z-93 is 0.92 BOL per Kauder 2005, 0.84 leaves dust/aging margin. AI-assisted, disclosed under rule 8.6."
    owner: luke
  radiator_temperature_k:
    value: 268.15  # Luke-approved, ESTIMATE: 5 K below the 273.15 K box for heat-pipe/cold-plate drop; must be <= box T. AI-assisted, disclosed under rule 8.6.
    units: K
    source: "Luke-approved, ESTIMATE: 5 K below the 273.15 K box for heat-pipe/cold-plate drop; must be <= box T. AI-assisted, disclosed under rule 8.6."
    owner: luke
  radiator_areal_mass_kg_per_m2:
    value: 12.3  # Luke-approved, SOURCED: Colozza 2020 Table 17 sum (includes louvers 4.5 kg/m2). AI-assisted, disclosed under rule 8.6.
    units: kg/m^2
    source: "Luke-approved, SOURCED: Colozza 2020 Table 17 sum (includes louvers 4.5 kg/m2). AI-assisted, disclosed under rule 8.6."
    owner: luke
  louver_area_multiplier:
    value: 1.3  # Luke-approved, SOURCED: Colozza 2020 Table 16 louver area adjustment factor. AI-assisted, disclosed under rule 8.6.
    units: dimensionless
    source: "Luke-approved, SOURCED: Colozza 2020 Table 16 louver area adjustment factor. AI-assisted, disclosed under rule 8.6."
    owner: luke
  radiator_closed_emissivity:
    value: 0.1  # Luke-approved, SOURCED: Gilmore (ed.) 2002 Spacecraft Thermal Control Handbook Vol.I Ch.9 Table 9.2 (closed 0.080-0.115). DESIGN CASE: louvers fail closed; stuck-open result is information only. AI-assisted, disclosed under rule 8.6.
    units: dimensionless
    source: "Luke-approved, SOURCED: Gilmore (ed.) 2002 Spacecraft Thermal Control Handbook Vol.I Ch.9 Table 9.2 (closed 0.080-0.115). DESIGN CASE: louvers fail closed; stuck-open result is information only. AI-assisted, disclosed under rule 8.6."
    owner: luke

wake_up:
  warm_up_h:
    value: 6
    units: h
    source: "Luke — dawn warm-up duration before charging"
    owner: luke
  solar_constant_w_per_m2:
    value: 1361
    units: W/m^2
    source: "AM0 solar constant"
    owner: cited-example
  panel_efficiency:
    value: 0.25  # Luke-approved, SOURCED: Colozza 2020 Table 15 multijunction array efficiency 25%. AI-assisted, disclosed under rule 8.6.
    units: dimensionless
    source: "Luke-approved, SOURCED: Colozza 2020 Table 15 multijunction array efficiency 25%. AI-assisted, disclosed under rule 8.6."
    owner: luke
  sun_incidence_cosine:
    value: 0.64  # Luke-approved, ESTIMATE: fixed vertical panel, no aiming: average cosine over a +-90 deg azimuth range = 2/pi = 0.64; CR1 sun elevation <= ~2 deg (NASA Moon fact sheet 1.54 deg tilt, CR1 89.45 S Glaser 2018). AI-assisted, disclosed under rule 8.6.
    units: dimensionless
    source: "Luke-approved, ESTIMATE: fixed vertical panel, no aiming: average cosine over a +-90 deg azimuth range = 2/pi = 0.64; CR1 sun elevation <= ~2 deg (NASA Moon fact sheet 1.54 deg tilt, CR1 89.45 S Glaser 2018). AI-assisted, disclosed under rule 8.6."
    owner: luke
  panel_areal_mass_kg_per_m2:
    value: 2.14  # Luke-approved, SOURCED: Colozza 2020: UltraFlex multijunction blanket 1.59 (Table 15) + structure 0.55 (Eq.67). AI-assisted, disclosed under rule 8.6.
    units: kg/m^2
    source: "Luke-approved, SOURCED: Colozza 2020: UltraFlex multijunction blanket 1.59 (Table 15) + structure 0.55 (Eq.67). AI-assisted, disclosed under rule 8.6."
    owner: luke

lander_legs:
  n_legs:
