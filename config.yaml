    units: count
    source: "Luke — four legs per pack lander"
    owner: luke
  leg_thermal_conductivity_w_per_mk:
    value: 6.7
    units: W/m-K
    source: "Ti-6Al-4V room-temperature k — tabulated in Colozza 2020"
    owner: cited-example
  leg_cross_section_m2:
    value: 0.000181  # placeholder, pending Daedalus leg/footpad design: Ti-6Al-4V tube 40 mm OD x 1.5 mm wall; AI-recommended. AI-assisted, disclosed under rule 8.6.
    units: m^2
    source: "placeholder, pending Daedalus leg/footpad design: Ti-6Al-4V tube 40 mm OD x 1.5 mm wall; AI-recommended. AI-assisted, disclosed under rule 8.6."
    owner: placeholder
  leg_length_m:
    value: 0.5  # placeholder, pending Daedalus leg/footpad design: between Okishio 2015 (0.3 m) and Colozza 2020 Table 10 (1.0 m); AI-recommended. AI-assisted, disclosed under rule 8.6.
    units: m
    source: "placeholder, pending Daedalus leg/footpad design: between Okishio 2015 (0.3 m) and Colozza 2020 Table 10 (1.0 m); AI-recommended. AI-assisted, disclosed under rule 8.6."
    owner: placeholder
  leg_surface_emissivity:
    value: 0.1  # placeholder, pending Daedalus leg/footpad design: low-e coated/wrapped leg (polished metal 0.03, Kauder 2005, plus dust allowance); AI-recommended. AI-assisted, disclosed under rule 8.6.
    units: dimensionless
    source: "placeholder, pending Daedalus leg/footpad design: low-e coated/wrapped leg (polished metal 0.03, Kauder 2005, plus dust allowance); AI-recommended. AI-assisted, disclosed under rule 8.6."
    owner: placeholder
  footpad_area_m2:
    value: 0.05  # placeholder, pending Daedalus leg/footpad design: about 3.6 kPa static per pad for ~440 kg pack in lunar g (Rogers 1972 TN D-6850); AI-recommended. AI-assisted, disclosed under rule 8.6.
    units: m^2
    source: "placeholder, pending Daedalus leg/footpad design: about 3.6 kPa static per pad for ~440 kg pack in lunar g (Rogers 1972 TN D-6850); AI-recommended. AI-assisted, disclosed under rule 8.6."
    owner: placeholder
  leg_perimeter_m:
    value: 0.126  # placeholder, pending Daedalus leg/footpad design: pi x 40 mm outer perimeter of the same tube; AI-recommended. AI-assisted, disclosed under rule 8.6.
    units: m
    source: "placeholder, pending Daedalus leg/footpad design: pi x 40 mm outer perimeter of the same tube; AI-recommended. AI-assisted, disclosed under rule 8.6."
    owner: placeholder
  leg_fin_segments:
    value: 12
    units: count
    source: "BVP initial mesh node count (numerical)"
    owner: numerical
  leg_material_sensitivity:
