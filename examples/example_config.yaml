# EXAMPLE ONLY — placeholder geometry and coupling, NOT Luke's design.
# Used for tests, examples/report.pdf, and thermal model verification.

meta:
  title: "EXAMPLE ONLY — distributed packs + radiators (not Luke's final geometry)"
  mode: "solve_rtg"

layout:
  model:
    value: distributed_packs
    units: string
    source: "Luke — several smaller packs across base, no central RTG deck"
    owner: luke

loads:
  primary_w:
    value: 5000
    units: W
    source: "Luke — primary night electrical load"
    owner: luke
night:
  t_dark_h:
    value: 72
    units: h
    source: "Luke — longest dark interval at the chosen CR1 site (CR1 illumination model). Program-level 'Night survival 120+ hours' in Requirements doc is the mission target; Luke chose 72 h for this site."
    owner: luke

battery:
